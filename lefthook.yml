# Clear Git hook environment variables before running checks so nested or sibling
# repositories are not affected: https://git-scm.com/docs/githooks
pre-commit:
  jobs:
    - name: shellcheck
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; shellcheck entrypoint/audit-toolchain scripts/check-image-metrics.sh scripts/check-entrypoint-trace.sh

pre-push:
  jobs:
    - name: shellcheck
      run: for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done; shellcheck entrypoint/audit-toolchain scripts/check-image-metrics.sh scripts/check-entrypoint-trace.sh
