name: Test docker build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"

      - name: Build (with GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: audit-toolchain:ci
          build-args: |
            AUDIT_TOOLCHAIN_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check version metadata
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          version_line="$(docker run --rm audit-toolchain:ci --version | sed -n '1p')"
          test "$version_line" = "audit-toolchain $EXPECTED_VERSION"

          label="$(docker inspect audit-toolchain:ci \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "$label" = "$EXPECTED_VERSION"

      - name: Check image metrics
        run: scripts/check-image-metrics.sh audit-toolchain:ci

      - name: Check version fallback
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          metadata_dir="$(mktemp -d)"
          trap 'rm -rf "$metadata_dir"' EXIT
          output="$(docker run --rm \
            -v "$metadata_dir:/usr/local/share/audit-toolchain:ro" \
            audit-toolchain:ci --version)"
          test "$output" = "audit-toolchain $EXPECTED_VERSION"

      - name: Check delegated tool invocation trace
        run: bash scripts/check-entrypoint-trace.sh audit-toolchain:ci
