name: Self audit
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build audit-toolchain image (with GHA layer cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: audit-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: markdownlint (markdown style)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/workspace" \
            audit-toolchain:ci markdownlint-cli2 "*.md"

      - name: lychee (offline link integrity)
        run: |
          docker run --rm --network=none \
            -v "$PWD:/workspace" \
            audit-toolchain:ci lychee --offline --no-progress "*.md"
